<div class="min-h-screen bg-black text-white pb-[4px]">
  <!-- NAVBAR -->
  <nav class="w-full border-b border-white/10 bg-black/80 backdrop-blur-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 py-4 flex items-center justify-between">
      <!-- LEFT SIDE -->
      <div class="flex items-center gap-3 sm:gap-4">
        <div
          class="w-10 h-10 sm:w-12 sm:h-12 rounded-full bg-gray-800 border border-gray-600 flex items-center justify-center text-white font-bold text-sm sm:text-lg shadow-md flex-shrink-0"
        >
          DS
        </div>
      </div>

      <!-- DESKTOP NAV LINKS -->
      <div class="hidden md:flex items-center gap-6 lg:gap-8 text-sm font-medium text-gray-300">
        <a
          routerLink="/home"
          routerLinkActive="active-link"
          [routerLinkActiveOptions]="{ exact: true }"
          class="nav-link"
        >
          Home
        </a>

        <a routerLink="/about" routerLinkActive="active-link" class="nav-link"> About </a>

        <a routerLink="/contact" routerLinkActive="active-link" class="nav-link"> Contact </a>
      </div>

      <!-- DOWNLOAD BUTTON -->
      <a
        href="assets/documents/Resume.pdf"
        download="Dhruv_Saligram_CV.pdf"
        class="bg-purple-500 hover:bg-purple-700 text-white px-4 sm:px-6 py-2 sm:py-3 rounded-xl font-semibold transition text-[12px] sm:text-[14px] whitespace-nowrap"
      >
        Download CV
      </a>
    </div>

    <!-- MOBILE NAVIGATION -->
    <div
      class="md:hidden border-t border-white/10 px-4 py-3 flex items-center justify-center gap-6 text-sm font-medium text-gray-300"
    >
      <a
        routerLink="/home"
        routerLinkActive="active-link"
        [routerLinkActiveOptions]="{ exact: true }"
        class="nav-link"
      >
        Home
      </a>

      <a routerLink="/about" routerLinkActive="active-link" class="nav-link"> About </a>

      <a routerLink="/contact" routerLinkActive="active-link" class="nav-link"> Contact </a>
    </div>
  </nav>

  <!-- PAGE CONTENT -->
  <router-outlet></router-outlet>
</div>
